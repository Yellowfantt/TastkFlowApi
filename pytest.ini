[pytest]
# Modo estrito do pytest-asyncio: cada teste precisa do marcador @pytest.mark.asyncio.
asyncio_mode = auto
# Mostra tracebacks mais curtos por padrão (não o traceback enorme do asyncio).
asyncio_default_fixture_loop_scope = function

# --- Cobertura (pytest-cov) ---
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
